# Boots one simulator, photographs the app in its deterministic mock states,
# and shuts the simulator down again. Manual only: the screenshots in docs/
# are refreshed when the UI has actually changed, not on every push.
name: Documentation Screenshots

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Simulator to photograph"
        required: false
        default: "iPad Pro 13-inch (M5)"
        type: string

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PATH: /Applications/Xcode_26.5.app

jobs:
  screenshots:
    name: Capture documentation screenshots
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm-packages
          key: shots-spm-${{ runner.os }}-${{ hashFiles('project.yml', 'LocalPackages/OpusShim/Package.swift') }}
          restore-keys: shots-spm-${{ runner.os }}-

      - name: Pick simulator
        id: simulator
        env:
          WANTED: ${{ github.event.inputs.device || 'iPad Pro 13-inch (M5)' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess

          devices = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"])
          )["devices"]
          wanted = os.environ["WANTED"]
          matches = [device for runtime in devices.values() for device in runtime
                     if device["name"].startswith("iPad")]
          if not matches:
              raise SystemExit("No available iPad simulator")
          picked = next((device for device in matches if device["name"] == wanted), matches[0])
          print(f"name={picked['name']}")
          print(f"udid={picked['udid']}")
          PY

      - name: Boot simulator
        run: |
          echo "Booting ${{ steps.simulator.outputs.name }}"
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
          # A documentation screenshot should not show a runner's clock or a
          # half-empty battery.
          xcrun simctl status_bar "${{ steps.simulator.outputs.udid }}" override \
            --time "09:41" \
            --batteryState charged \
            --batteryLevel 100 \
            --wifiBars 3 \
            --cellularMode notSupported || true

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project MossLive.xcodeproj \
            -scheme MossLiveUITests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm-packages \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -30

      # The capture itself is an XCUITest: it launches each mock state in the
      # app's own locale, rotates to landscape, and attaches one named
      # screenshot per screen.
      - name: Capture screens
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project MossLive.xcodeproj \
            -scheme MossLiveUITests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm-packages \
            -derivedDataPath DerivedData \
            -resultBundlePath Screenshots.xcresult \
            -only-testing:MossLiveUITests/DocumentationScreenshots \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -30

      # Attachments come out with generated filenames; manifest.json carries
      # the name each `shot(...)` gave them.
      - name: Name the screenshots
        run: |
          rm -rf exported screenshots
          mkdir -p exported screenshots
          xcrun xcresulttool export attachments \
            --path Screenshots.xcresult \
            --output-path exported
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          exported = pathlib.Path("exported")
          out = pathlib.Path("screenshots")
          manifest = json.loads((exported / "manifest.json").read_text())
          wanted = {"recording", "lessons", "learn", "chat", "library"}
          found = set()

          for test in manifest:
              for attachment in test.get("attachments", []):
                  name = attachment.get("suggestedHumanReadableName", "")
                  # XCTest exports "<attachment name>_<index>_<uuid>.png".
                  stem = name.split("_", 1)[0]
                  if stem in wanted:
                      source = exported / attachment["exportedFileName"]
                      shutil.copyfile(source, out / f"{stem}.png")
                      found.add(stem)

          missing = wanted - found
          if missing:
              raise SystemExit(f"::error::no screenshot captured for: {sorted(missing)}")
          print("captured:", sorted(found))
          PY
          ls -la screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: documentation-screenshots
          path: screenshots/
          retention-days: 7

      - name: Shut down simulator
        if: always()
        run: |
          xcrun simctl status_bar "${{ steps.simulator.outputs.udid }}" clear || true
          xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true
