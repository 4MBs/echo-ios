# macOS build + test + unsigned IPA. Kept frugal for a private repo:
# path filters skip doc-only changes, concurrency cancels superseded runs,
# and everything runs in a single macOS job (tests + device build).
name: CI

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "LocalPackages/**"
      - "project.yml"
      - "scripts/ci/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "LocalPackages/**"
      - "project.yml"
      - "scripts/ci/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # macos-26 ships the iOS 26 SDK (Liquid Glass). Older images (macos-15) do
  # not have Xcode 26 due to storage limits, so this runner is required.
  XCODE_PATH: /Applications/Xcode_26.5.app

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Xcode and print versions
        run: |
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          else
            echo "::warning::pinned Xcode at $XCODE_PATH not on this runner image; using default"
          fi
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Every build gets a unique, visible version (Settings -> About shows
      # it). XcodeGen's generated plists hardcode 1.0/1, so stamp explicitly;
      # identical versions also confuse SideStore/AltStore update installs.
      - name: Stamp build version
        run: |
          V="1.0.${{ github.run_number }}"
          for PLIST in Sources/MossLive/Info.plist Sources/MossLiveWidget/Info.plist Sources/EchoShareExtension/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $V" "$PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" "$PLIST"
          done

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm-packages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'LocalPackages/OpusShim/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MossLive.xcodeproj -scheme MossLive \
            -clonedSourcePackagesDirPath .spm-packages

      - name: Pick an available iOS simulator
        id: sim
        run: |
          pick() { xcrun simctl list devices available | grep -E '^ +iPhone' | head -1 | sed -E 's/^ +//; s/ \([0-9A-Fa-f-]+\) \((Shutdown|Booted)\).*$//'; }
          DEVICE=$(pick)
          if [ -z "$DEVICE" ]; then
            echo "::warning::no simulator runtime for the pinned Xcode; falling back to the image default Xcode"
            sudo xcode-select -r
            xcodebuild -version
            DEVICE=$(pick)
          fi
          if [ -z "$DEVICE" ]; then
            echo "::warning::no simulators at all; downloading the iOS platform (slow)"
            sudo xcodebuild -downloadPlatform iOS
            DEVICE=$(pick)
          fi
          [ -n "$DEVICE" ] || { echo "::error::could not find or create an iOS simulator"; exit 1; }
          echo "picked simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Unit tests (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project MossLive.xcodeproj \
            -scheme MossLive \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}" \
            -clonedSourcePackagesDirPath .spm-packages \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO | tail -100

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults.xcresult
          retention-days: 14

      - name: Build unsigned device binary
        run: |
          set -o pipefail
          xcodebuild build \
            -project MossLive.xcodeproj \
            -scheme MossLive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            -clonedSourcePackagesDirPath .spm-packages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -60

      # Ad-hoc signatures carry the app-group entitlement, which sideloading
      # tools read and rewrite during their own re-signing — this is what lets
      # the widget share the app's server settings (zero widget config).
      # Inner bundle first, then the app (not --deep, which would clobber it).
      - name: Ad-hoc sign with entitlements
        run: |
          APP=build/dd/Build/Products/Release-iphoneos/MossLive.app
          codesign --force --sign - --entitlements EchoShareExtension.entitlements \
            "$APP/PlugIns/EchoShareExtension.appex"
          codesign --force --sign - --entitlements MossLiveWidget.entitlements \
            "$APP/PlugIns/MossLiveWidget.appex"
          codesign --force --sign - --entitlements MossLive.entitlements "$APP"
          codesign -d --entitlements - "$APP" 2>&1 | head -20

      - name: Package unsigned IPA (installable via SideStore)
        run: |
          scripts/ci/make_unsigned_ipa.sh \
            build/dd/Build/Products/Release-iphoneos/MossLive.app \
            MossLive-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MossLive-unsigned-ipa-${{ github.run_number }}
          path: MossLive-unsigned.ipa
          retention-days: 30

      - name: Job summary
        if: always()
        run: |
          {
            echo "### MOSS Live CI"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- Build number: ${{ github.run_number }}"
            echo "- Unsigned IPA artifact: install with SideStore/AltStore"
            echo "- Code signing: **not configured** in this workflow"
          } >> "$GITHUB_STEP_SUMMARY"
