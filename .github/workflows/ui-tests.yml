name: Exhaustive iOS Simulator UI Tests

on:
  workflow_dispatch:
    inputs:
      test_class:
        description: 'Test class to run (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - LibraryReaderUITests
          - LibraryReaderUITests/testReaderPageEntryFocusSubmitAndOutsideDismissal
          - LearnUITests
          - ChatUITests
          - LessonsUITests
          - SettingsUITests
          - ShellAndStateUITests
          - DestructiveFlowsUITests

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_PATH: /Applications/Xcode_26.5.app

jobs:
  simulator-suite:
    name: ${{ matrix.form-factor }} ${{ github.event.inputs.test_class || 'complete' }} suite
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Echo is an iPad app first, and every flow is covered there. Add
        # "iphone" back to this list to run the same suite on the phone.
        form-factor: [ipad]

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode and print environment
        run: |
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm-packages
          key: ui-spm-${{ runner.os }}-${{ hashFiles('project.yml', 'LocalPackages/OpusShim/Package.swift') }}
          restore-keys: ui-spm-${{ runner.os }}-

      - name: Resolve dependencies
        if: ${{ github.event.inputs.test_class == 'all' }}
        run: |
          xcodebuild -resolvePackageDependencies \
            -project MossLive.xcodeproj \
            -scheme MossLiveUITests \
            -clonedSourcePackagesDirPath .spm-packages

      - name: Pick simulator
        id: simulator
        env:
          FORM_FACTOR: ${{ matrix.form-factor }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import subprocess

          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          family = os.environ["FORM_FACTOR"]
          preferred = "iPhone 17 Pro" if family == "iphone" else "iPad Pro 13-inch (M5)"
          prefix = "iPhone" if family == "iphone" else "iPad"
          matches = [device for runtime in devices.values() for device in runtime if device["name"].startswith(prefix)]
          if not matches:
              raise SystemExit(f"No available {prefix} simulator")
          picked = next((device for device in matches if device["name"] == preferred), matches[0])
          print(f"name={picked['name']}")
          print(f"udid={picked['udid']}")
          PY
          echo "Selected ${{ steps.simulator.outputs.name }} (${{ steps.simulator.outputs.udid }})"

      - name: Boot and configure simulator
        env:
          TEST_CLASS: ${{ github.event.inputs.test_class }}
        run: |
          # Headless: the Simulator window is only overhead on a runner.
          # Set this before boot so focused keyboard tests do not need to wait
          # for a running simulator merely to expose the software keyboard.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true
          if [ "$TEST_CLASS" != "all" ]; then
            echo "Simulator boot continues while the focused test compiles."
            exit 0
          fi
          xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b
          # Disable software keyboard predictions and autocorrect overhead
          xcrun simctl spawn "${{ steps.simulator.outputs.udid }}" defaults write com.apple.Preferences KeyboardAutocorrection -bool false || true
          xcrun simctl spawn "${{ steps.simulator.outputs.udid }}" defaults write com.apple.Preferences KeyboardPrediction -bool false || true
          xcrun simctl spawn "${{ steps.simulator.outputs.udid }}" defaults write com.apple.Preferences KeyboardShowPredictionBar -bool false || true

      # Building once up front keeps the compile out of the timed test run and
      # lets the suite start on every clone at the same moment.
      - name: Build for testing
        run: |
          set -o pipefail
          DESTINATION="platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}"
          CLASS="${{ github.event.inputs.test_class }}"
          if [ -n "$CLASS" ] && [ "$CLASS" != "all" ]; then
            # This build does not wait for the concrete simulator to finish
            # booting. The following test step uses the resulting products.
            DESTINATION="generic/platform=iOS Simulator"
          fi
          xcodebuild build-for-testing \
            -project MossLive.xcodeproj \
            -scheme MossLiveUITests \
            -destination "$DESTINATION" \
            -clonedSourcePackagesDirPath .spm-packages \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      # Parallel workers were tried and were slower: the runner only granted
      # two simulator clones, and sharing its cores made every UI interaction
      # slow enough that timing-sensitive flows started failing. One simulator,
      # one test at a time, with the waiting taken out of the fixtures instead.
      - name: Run XCUITest suite
        run: |
          set -o pipefail
          TEST_FILTER=""
          CLASS="${{ github.event.inputs.test_class }}"
          if [ -n "$CLASS" ] && [ "$CLASS" != "all" ]; then
            TEST_FILTER="-only-testing:MossLiveUITests/$CLASS"
            echo "Running only target test class: $CLASS"
          fi
          xcodebuild test-without-building \
            -project MossLive.xcodeproj \
            -scheme MossLiveUITests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm-packages \
            -derivedDataPath DerivedData \
            -resultBundlePath UIResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 240 \
            -maximum-test-execution-time-allowance 600 \
            $TEST_FILTER \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui-test.log

      - name: Export screenshots
        if: ${{ failure() || github.event.inputs.test_class == 'all' }}
        run: |
          mkdir -p UIScreenshots
          if [ -d UIResults.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path UIResults.xcresult \
              --output-path UIScreenshots || true
          fi
          find UIScreenshots -type f -maxdepth 2 -print | sort || true

      - name: Upload result bundle, screenshots, and log
        if: ${{ failure() || github.event.inputs.test_class == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: simulator-${{ matrix.form-factor }}-${{ github.run_number }}
          path: |
            UIResults.xcresult
            UIScreenshots
            ui-test.log
          if-no-files-found: warn
          retention-days: 30
