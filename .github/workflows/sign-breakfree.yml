name: sign-breakfree-shortcut
on:
  push:
    branches: [tmp-sign-breakfree-cp3]
    paths:
      - '.github/workflows/sign-breakfree.yml'

jobs:
  sign:
    runs-on: macos-latest
    steps:
      - name: Download official BreakFree v2.6
        run: |
          curl -fL 'https://github.com/FrizzleM/BreakFree/releases/download/v2.6/BreakFree.shortcut' -o BreakFree.shortcut
          echo 'Expected: 62338ea07130557c1feb10a8fe855e901f0052cfa6369e0c3ac0909b1e030ecb'
          shasum -a 256 BreakFree.shortcut

      - name: Decompile signed Shortcut losslessly
        run: |
          git clone --depth 1 https://github.com/Wuvomi/shortcut-cli.git shortcut-cli
          SHORTCUT_CLI_LANG=en python3 shortcut-cli/shortcut_cli.py decompile BreakFree.shortcut -o BreakFree.json

      - name: Patch Checkpoint 3 and compile unsigned plist
        run: |
          python3 - <<'PY'
          import json
          p='BreakFree.json'
          with open(p, encoding='utf-8') as f:
              obj=json.load(f)
          actions=obj['WFWorkflowActions']
          assert len(actions)==433, len(actions)
          assert actions[299]['WFWorkflowActionIdentifier']=='is.workflow.actions.openurl'
          assert actions[300]['WFWorkflowActionIdentifier']=='is.workflow.actions.alert'
          actions[299]={
            'WFWorkflowActionIdentifier':'is.workflow.actions.alert',
            'WFWorkflowActionParameters':{
              'WFAlertActionTitle':'Checkpoint 3 — manual patch',
              'WFAlertActionMessage':'PATCHED CHECKPOINT 3 — manual continuation\\n\\n1. Before starting this checkpoint, set BreakFreeDNS to Standard.\\n2. Open Feather and finish its intro.\\n3. Feather → Settings → Add Certificate. Import the certificate that worked in Checkpoint 2 and its matching provisioning profile; use the password information supplied with your own certificate package.\\n4. On iOS 18 or newer: Feather → Settings → Server Options → enable Online Install Method. Feather may restart.\\n5. In iOS Settings → Shortcuts, enable Private Sharing. In Advanced, enable the sharing option needed by the source importer.\\n6. Source importing is optional for signing. Once Feather shows the certificate under Signing, the core setup is complete.\\n\\nThis patched checkpoint intentionally does not jump between Settings/Feather and Shortcuts, because the original Wait to Return sequence can fail to resume.',
              'WFAlertActionCancelButtonShown':False
            }
          }
          actions[300]={
            'WFWorkflowActionIdentifier':'is.workflow.actions.exit',
            'WFWorkflowActionParameters':{}
          }
          with open(p,'w',encoding='utf-8') as f:
              json.dump(obj,f,ensure_ascii=False,indent=2)
          PY
          SHORTCUT_CLI_LANG=en python3 shortcut-cli/shortcut_cli.py compile BreakFree.json --no-sign -o BreakFree_v2.6_CP3_manual_patch_UNSIGNED.shortcut
          file BreakFree_v2.6_CP3_manual_patch_UNSIGNED.shortcut

      - name: Sign through RoutineHub HubSign
        run: |
          git clone --depth 1 https://github.com/wynx1123/shortcut-signer.git shortcut-signer
          python3 shortcut-signer/sign.py BreakFree_v2.6_CP3_manual_patch_UNSIGNED.shortcut -o BreakFree_v2.6_CP3_fixed.shortcut -n BreakFree
          python3 - <<'PY'
          from pathlib import Path
          p=Path('BreakFree_v2.6_CP3_fixed.shortcut')
          data=p.read_bytes()
          assert data[:4]==b'AEA1', data[:4]
          print('signed bytes:', len(data))
          PY
          shasum -a 256 BreakFree_v2.6_CP3_fixed.shortcut

      - name: Verify signed Shortcut action count
        run: |
          SHORTCUT_CLI_LANG=en python3 shortcut-cli/shortcut_cli.py verify BreakFree_v2.6_CP3_fixed.shortcut

      - name: Upload signed Shortcut
        uses: actions/upload-artifact@v4
        with:
          name: BreakFree-v2.6-CP3-fixed
          path: BreakFree_v2.6_CP3_fixed.shortcut
          if-no-files-found: error
