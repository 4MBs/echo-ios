# Cheap checks on ubuntu runners (private repo: macOS minutes bill at 10x,
# linux at 1x — so style gates never touch macOS).
name: Lint

on:
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "LocalPackages/**", ".swiftlint.yml", ".swiftformat", ".github/workflows/lint.yml"]
  pull_request:
    paths: ["Sources/**", "Tests/**", "LocalPackages/**", ".swiftlint.yml", ".swiftformat", ".github/workflows/lint.yml"]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: ghcr.io/realm/swiftlint:0.57.1
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint
        run: swiftlint --reporter github-actions-logging

  swiftformat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the container image is used instead of the prebuilt linux binary,
    # which segfaults intermittently (exit 139)
    container: ghcr.io/nicklockwood/swiftformat:0.55.5
    steps:
      - uses: actions/checkout@v4
      - name: SwiftFormat lint
        run: swiftformat Sources Tests --lint
