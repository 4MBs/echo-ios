# XcodeGen project definition — the .xcodeproj is generated (never committed):
#   xcodegen generate
# This keeps the project fully editable from Linux; CI regenerates it on macOS.
name: MossLive

options:
  bundleIdPrefix: com.fourmbs
  # iOS 26 so the UI can use the real Liquid Glass APIs (.glassEffect,
  # .buttonStyle(.glass)) without availability gating. Built with Xcode 26 on
  # the macos-26 GitHub runner.
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true

packages:
  OpusShim:
    path: LocalPackages/OpusShim
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20

settings:
  base:
    SWIFT_VERSION: "5.0"          # Swift 5 language mode (concurrency still checked)
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"  # overridden by CI with the workflow run number
    DEVELOPMENT_TEAM: ""          # set via CI env when signing is configured
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  MossLive:
    type: application
    platform: iOS
    sources:
      - Sources/MossLive
      - Sources/Shared
    dependencies:
      - package: OpusShim
        product: OpusShim
      - package: ZIPFoundation
        product: ZIPFoundation
      - target: MossLiveWidget
        embed: true
      - target: EchoShareExtension
        embed: true
    # The app group lets the widget read the app's server settings (zero
    # widget configuration). CI ad-hoc-signs the bundles with these
    # entitlements so SideStore/AltStore can pick the group up and rewrite it
    # for the user's team during re-signing.
    entitlements:
      path: MossLive.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fourmbs.mosslive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourmbs.mosslive
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
    info:
      path: Sources/MossLive/Info.plist
      properties:
        CFBundleDisplayName: Echo
        # The app talks ws:// (cleartext) to the user's own machine over a
        # Tailscale address; the link is already WireGuard-encrypted, and ATS
        # would otherwise block the in-app WebSocket (Safari is not affected,
        # which makes this failure mode confusing to debug).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSMicrophoneUsageDescription: >-
          Echo streams microphone audio to your own private computer for
          live transcription and lets you dictate questions in AI chat.
          Audio never goes to a third-party service.
        NSSpeechRecognitionUsageDescription: >-
          Echo uses Apple's on-device speech recognition so you can dictate
          questions in AI chat.
        NSCameraUsageDescription: >-
          Echo lets you photograph notes and add their locally recognized text
          to an AI chat.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

  MossLiveWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/MossLiveWidget
      - Sources/Shared
    entitlements:
      path: MossLiveWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fourmbs.mosslive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourmbs.mosslive.widget
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        SKIP_INSTALL: true
    info:
      path: Sources/MossLiveWidget/Info.plist
      properties:
        CFBundleDisplayName: Echo Answer
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # widget talks ws-less plain http to the Tailscale-only server;
        # the link is WireGuard-encrypted by Tailscale
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true

  EchoShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - Sources/EchoShareExtension
      - Sources/Shared
    entitlements:
      path: EchoShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fourmbs.mosslive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourmbs.mosslive.share
        APPLICATION_EXTENSION_API_ONLY: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        SKIP_INSTALL: true
    info:
      path: Sources/EchoShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Echo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsAttachmentsWithMinCount: 1
              NSExtensionActivationSupportsAttachmentsWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1

  MossLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/MossLiveTests
    dependencies:
      - target: MossLive

  MossLiveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/MossLiveUITests
    dependencies:
      - target: MossLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourmbs.mosslive.uitests
        TEST_TARGET_NAME: MossLive
        CODE_SIGN_STYLE: Automatic

schemes:
  MossLive:
    build:
      targets:
        MossLive: all
        MossLiveTests: [test]
    test:
      targets: [MossLiveTests]
      gatherCoverageData: false

  MossLiveUITests:
    build:
      targets:
        MossLive: all
        MossLiveUITests: [test]
    test:
      targets: [MossLiveUITests]
      gatherCoverageData: false
