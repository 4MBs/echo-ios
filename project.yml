# XcodeGen project definition — the .xcodeproj is generated (never committed):
#   xcodegen generate
# This keeps the project fully editable from Linux; CI regenerates it on macOS.
name: MossLive

options:
  bundleIdPrefix: com.fourmbs
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
  createIntermediateGroups: true

packages:
  OpusShim:
    path: LocalPackages/OpusShim

settings:
  base:
    SWIFT_VERSION: "5.0"          # Swift 5 language mode (concurrency still checked)
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"  # overridden by CI with the workflow run number
    DEVELOPMENT_TEAM: ""          # set via CI env when signing is configured
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  MossLive:
    type: application
    platform: iOS
    sources:
      - Sources/MossLive
    dependencies:
      - package: OpusShim
        product: OpusShim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fourmbs.mosslive
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
    info:
      path: Sources/MossLive/Info.plist
      properties:
        CFBundleDisplayName: MOSS Live
        NSMicrophoneUsageDescription: >-
          MOSS Live streams microphone audio to your own private computer for
          live transcription. Audio never goes to a third-party service.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

  MossLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/MossLiveTests
    dependencies:
      - target: MossLive

schemes:
  MossLive:
    build:
      targets:
        MossLive: all
        MossLiveTests: [test]
    test:
      targets: [MossLiveTests]
      gatherCoverageData: false
