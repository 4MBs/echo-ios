included:
  - Sources
  - Tests

# Keep the established repository debt explicit while requiring every new or
# moved violation to pass the normal rule set. Regenerate deliberately with
# `swiftlint lint --write-baseline .swiftlint-baseline.json` after fixing debt.
baseline: .swiftlint-baseline.json

excluded:
  - LocalPackages

line_length:
  warning: 120
  error: 160

identifier_name:
  min_length: 2
  excluded: [id, ws, t0, t1, a, b]

type_body_length:
  warning: 400

function_body_length:
  warning: 80

disabled_rules:
  - todo
  - trailing_comma
